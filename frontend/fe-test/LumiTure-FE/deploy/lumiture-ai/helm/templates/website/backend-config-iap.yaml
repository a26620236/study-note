{{- if .Values.iap.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "app.website.name" . }}-iap-config
  namespace: {{ .Values.namespace }}
spec:
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: "{{ .Values.iap.secretName }}"
{{- end }}
