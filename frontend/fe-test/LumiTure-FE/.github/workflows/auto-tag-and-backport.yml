name: Auto Tag & Backport

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-backport:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LUMITURE_BOT_APP_ID }}
          private-key: ${{ secrets.LUMITURE_BOT_PRIVATE_KEY }}

      - name: Auto tag and create backport PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const mergeCommitSha = pr.merge_commit_sha;

            // Step 1: Extract and validate version
            const rawVersion = branch.replace(/^(release|hotfix)\//, '');
            const version = rawVersion.startsWith('v') ? rawVersion : `v${rawVersion}`;

            if (!/^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/.test(version)) {
              core.setFailed(`Invalid version format: ${version} (from branch ${branch})`);
              return;
            }
            core.info(`Version: ${version} (from branch: ${branch})`);

            // Step 2: Create git tag on the merge commit
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${version}`,
                sha: mergeCommitSha,
              });
              core.info(`Created tag ${version} at ${mergeCommitSha}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning(`Tag ${version} already exists, skipping`);
              } else {
                throw error;
              }
            }

            // Step 3: Create GitHub Release
            try {
              const { data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: version,
                name: version,
                generate_release_notes: true,
              });
              core.info(`Created release: ${release.html_url}`);
            } catch (error) {
              core.warning(`Failed to create release: ${error.message}`);
            }

            // Step 4 & 5: Create backport PRs via new branches
            const targets = [
              { base: 'develop', label: 'Dev' },
              { base: 'staging', label: 'Stag' },
            ];

            for (const { base, label } of targets) {
              const backportBranch = `backport/${version}-to-${base}`;

              try {
                // Check if an open backport PR already exists
                const { data: existingPRs } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${owner}:${backportBranch}`,
                  base,
                });

                if (existingPRs.length > 0) {
                  core.warning(`Open backport PR to ${base} already exists: #${existingPRs[0].number}, skipping`);
                  continue;
                }

                // Create backport branch from main's merge commit
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${backportBranch}`,
                  sha: mergeCommitSha,
                });
                core.info(`Created branch ${backportBranch}`);

                // Create backport PR
                const { data: newPR } = await github.rest.pulls.create({
                  owner,
                  repo,
                  head: backportBranch,
                  base,
                  title: `[Backport] Main(${version}) to ${label}`,
                  body: [
                    '## Summary',
                    '',
                    `Backport \`${version}\` from \`main\` to \`${base}\`.`,
                    '',
                    `- Source PR: #${pr.number}`,
                    `- Tag: \`${version}\``,
                    '',
                    '> This PR was automatically created by the **Auto Tag & Backport** workflow.',
                    '> Please resolve any merge conflicts before merging.',
                  ].join('\n'),
                });

                core.info(`Created backport PR to ${base}: #${newPR.number}`);
              } catch (error) {
                core.warning(`Failed to create backport PR to ${base}: ${error.message}`);
              }
            }
